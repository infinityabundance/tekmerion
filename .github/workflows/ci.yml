name: CI

# Offline checks only. This workflow never runs HOL Light, never touches the
# 20 GB s2n-bignum bench, and never needs a model API key. The steps that use
# the network are image provisioning (the apt installs) and "Prime crate
# cache", which populates the local cargo registry so that every check can run
# with --offline.
#
# XXVI.F: this was one job with a single 30-minute timeout, and it repeated the
# heavy work — `tools/selftest.sh` re-ran `cargo test` and both mutation
# harnesses that earlier steps had already run — so runs were cancelled at the
# timeout with the initial steps green. It is now three independent jobs, each
# with its own timeout, and the scaffold job runs selftest.sh with
# SELFTEST_SKIP_HEAVY=1 so nothing heavy runs twice. No job uses
# continue-on-error: the workflow fails if any job fails.

on:
  push:
    branches: [staging, main]
  pull_request:

permissions:
  contents: read

jobs:
  # Ordinary tests, the two explicitly-logged gates, and the lint. This is the
  # job that gates correctness of the library itself.
  tests:
    name: Tests + clippy (no key, no bench)
    # Pinned image: `ocaml-nox` has no installation candidate on the current
    # ubuntu-latest (24.04) runner, which made both CI runs fail before any
    # check executed. 22.04 carries it and its ocamlc supports -stop-after.
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust 1.98.0 with clippy
        # Pinned to the toolchain this workflow was verified with, so a future
        # clippy release cannot silently turn a green run red.
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          rustup default 1.98.0
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The answer-elaboration gate below drives the real OCaml front end; it
      # needs ocamlc but does not load HOL Light or the bench.
      - name: Install OCaml (front end for the elaboration gate)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocaml-nox
          ocamlc -version

      # The ARM tests disassemble AArch64 objects, and the runner's GNU objdump
      # is x86-only: without this package they fail inside objdump with
      # "can't disassemble for architecture UNKNOWN!". This provisions the
      # tool; src/tools/disasm.rs still *probes* it on the committed fixture
      # `tests/fixtures/aarch64_add.o` before selecting it, so a package that
      # does not work is refused rather than trusted. No test is skipped.
      - name: Install AArch64 binutils (disassembler for the ARM tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu
          aarch64-linux-gnu-objdump --version | head -1

      # Bootstrap only. Every check below runs with --offline and therefore
      # needs no further network access.
      - name: Prime crate cache
        run: cargo fetch --locked

      - name: cargo test (offline)
        run: cargo test --offline

      # XIX.B3: the answer-elaboration gate is part of `cargo test`, but it is
      # run here explicitly so its output (the ocamlc version, the quotation
      # count and the front end's exit status) is in the CI log.  A missing
      # `ocamlc` fails the test; nothing is skipped.
      - name: Answer elaboration gate (real OCaml front end)
        run: cargo test --offline --test answer_elaboration -- --nocapture

      # XIX.A3: exhaustive small-domain tests for the interval engine.  The
      # extracted block is compiled against an exact-rational `Num' shim; every
      # bound pair is compared with enumerated points, and the retired
      # join-based rule is required to fail.  No proof build, no bench.
      - name: Interval engine exhaustive tests (offline)
        run: bash tests/interval_engine_selftest.sh

      # No continue-on-error: the job must fail if a lint appears. Verified green
      # locally before adding this file (clippy 0.1.98, rust 1.98.0).
      - name: cargo clippy (offline, warnings are errors)
        run: cargo clippy --offline --all-targets -- -D warnings

      # The Python proof-production chain (guard, derive, disasm, emitters) and
      # its pytest suite are now Rust (`src/tools`, `tests/tools_*.rs`), so there
      # is no pytest-collectable Python test left to run here. The write-through
      # harness is now `tests/write_through.rs`, which compiles the OCaml module
      # against stubs and is exercised by both `cargo test` and
      # `tools/selftest.sh` in the `selftest` job.

  # The mutation harnesses. They are the most expensive checks, so they get
  # their own job and timeout. Both operators are run: reachability (the
  # default) and accept, with the accept score printed to the log by the
  # harness itself.
  mutation:
    name: Mutation harnesses (reachability + accept, offline)
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustc --version
          cargo --version

      # The lifecycle harness runs the full test suite via `cargo run --bin
      # mutate_lifecycle`, which includes the answer-elaboration gate (needs
      # `ocamlc`) and the ARM disassembly tests (need `aarch64-linux-gnu-objdump`).
      # Jobs do not share installed packages, so this job must provision them
      # itself. Nothing is skipped: a missing tool fails the harness.
      - name: Install test prerequisites (OCaml front end + AArch64 binutils)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocaml-nox binutils-aarch64-linux-gnu
          ocamlc -version
          aarch64-linux-gnu-objdump --version | head -1

      - name: Prime crate cache
        run: cargo fetch --locked

      - name: Refusal-site mutation harness (offline)
        run: cargo run --offline --quiet --bin mutate

      - name: Lifecycle mutation harness (offline)
        run: cargo run --offline --quiet --bin mutate_lifecycle

      # The guard now lives in src/tools/guard.rs. The Rust harness mutates every
      # Err(Refused::new(..)) site in it and requires tests/tools_guard.rs to
      # notice; it restores the file in Drop.
      - name: Guard refusal-site mutation harness (reachability, offline)
        run: cargo run --offline --quiet --bin mutate_guard

      # Operator 2 (accept). The harness prints the accept score (today 61/61
      # valid mutants, 0 survived) to the log. No continue-on-error: a non-zero
      # exit fails this job, which fails the workflow.
      - name: Guard refusal-site mutation harness (accept, offline)
        env:
          MUTATE_GUARD_OPERATOR: accept
        run: cargo run --offline --quiet --bin mutate_guard

  # Scaffold integration: the checks that are unique to tools/selftest.sh
  # (OCaml syntax, the binary self-tests, run_traces.sh argument parsing, the
  # write-through harness). SELFTEST_SKIP_HEAVY=1 omits sections 6/7a, 6/7b
  # and 7/7, which the `tests` and `mutation` jobs already run, so nothing
  # heavy is duplicated; the skip is printed in the log.
  selftest:
    name: Scaffold self-test (offline, heavy stages skipped)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustc --version
          cargo --version

      # Section 1 syntax-checks an OCaml module; it needs ocamlc but does not
      # load HOL Light or the bench.
      - name: Install OCaml (syntax check only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocaml-nox
          ocamlc -version

      - name: Prime crate cache
        run: cargo fetch --locked

      - name: Scaffold self-test (offline, SELFTEST_SKIP_HEAVY=1)
        run: SELFTEST_SKIP_HEAVY=1 bash tools/selftest.sh
