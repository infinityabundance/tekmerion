[package]
name = "tekmerion"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "Machine-code verification: generated HOL Light proofs, a solver-free arithmetic close, and an independent Rust proof-object checker"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/infinityabundance/tekmerion"
homepage = "https://github.com/infinityabundance/tekmerion"
readme = "README.md"
keywords = ["formal-verification", "hol-light", "machine-code", "proof-checking", "arithmetic"]
categories = ["development-tools", "science"]
exclude = ["/target", "/.github"]

[dependencies]
sha2 = "0.10"

[features]
# Off by default. `src/bin/mutate_lifecycle.rs` enables this feature and drives a
# deterministic lifecycle fault through TEKMERION_FAULT.
default = []
fault-injection = []

[profile.test]
opt-level = 1
